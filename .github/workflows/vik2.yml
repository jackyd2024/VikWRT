name: vikwrt2

on:
#  schedule:
#    - cron: '0 15 */15 * *' # 每 15 天的 15:00 执行一次
  workflow_dispatch:

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: vikwrt.config
  TZ: Asia/Shanghai
  DEVICE: vikwrtAX6600
  UPLOAD_OUTPUT: true
  CCACHE_DIR: /workdir/openwrt/.ccache
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-openwrt:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 删除旧的 Releases 保留最近4个
      uses: dev-drprasad/delete-older-releases@master
      with:
          keep_latest: 4
          delete_tags: true

    - name: 删除最近的workflow 保留最近1个
      uses: Mattraks/delete-workflow-runs@main
      with:
          retain_days: 0
          keep_minimum_runs: 1

    - name: 检查配置文件是否存在
      run: |
        echo "【步骤1】检查配置文件"
        CONFIG_FILE_PATH="$GITHUB_WORKSPACE/vikwrt.config"
        if [[ -f "$CONFIG_FILE_PATH" ]]; then
          echo "配置文件已找到: $CONFIG_FILE_PATH ✅"
        else
          echo "❌ 配置文件未找到，开始查找..."
          CONFIG_FOUND=$(find $GITHUB_WORKSPACE -name "vikwrt.config" -type f)
          if [[ -n "$CONFIG_FOUND" ]]; then
            echo "已找到配置文件路径: $CONFIG_FOUND ✅"
            cp -f "$CONFIG_FOUND" "$GITHUB_WORKSPACE/openwrt/.config"
            echo "成功复制配置文件到目标位置 ✅"
          else
            echo "❌ 未能找到 vikwrt.config 文件，请确认文件是否存在于仓库中！"
            exit 1
          fi
        fi

    - name: 初始化构建环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "【步骤2】初始化构建环境"
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
          swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        sudo timedatectl set-timezone "Asia/Shanghai"
        echo "构建环境初始化完成 ✅"

    - name: Free Up Disk Space
      run: |
        echo "清理空间"
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/share/powershell
        sudo apt-get clean
        sudo docker system prune -af || true
        df -h  # 再次检查磁盘空间

    - name: 克隆源码
      working-directory: /workdir
      run: |
        echo "【步骤3】克隆源码"
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        sudo mkdir -p -m 777 /mnt/openwrt/{dl,feeds}

        ln -s /mnt/openwrt/dl /workdir/openwrt/dl
        ln -s /mnt/openwrt/feeds /workdir/openwrt/feeds
        echo "源码克隆完成 ✅"

    - name: 恢复缓存
      uses: actions/cache@v3
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-openwrt-${{ env.DEVICE }}-ccache
        restore-keys: |
          ${{ runner.os }}-openwrt-${{ env.DEVICE }}-

    - name: 配置 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
      # 修改 Lan IP 和修复版本
    - name: 修改 Lan IP 和修复版本
      run: |
          echo "【步骤5】修改 Lan IP 和修复版本"
          cd openwrt
          sed -i 's/192.168.1.1/192.168.0.1/g' package/base-files/files/bin/config_generate
          echo "【修改完成后内容如下】"
          grep "192.168" package/base-files/files/bin/config_generate
          echo "Lan IP 修改完成 ✅"
        
      # 组合插件
    - name: 组合插件
      run: |
        cd openwrt

        rm -rf package/emortal/athena-led
        rm -rf package/emortal/luci-app-athena-led
        rm -rf package/temp-athena

        git clone --depth=1 \
          https://github.com/unraveloop/JDC-AX6600-Athena-LED-Controller.git \
          package/temp-athena

        cp -a package/temp-athena/athena-led package/emortal/athena-led
        cp -a package/temp-athena/luci-app-athena-led package/emortal/luci-app-athena-led

        sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=2.4.0/' package/emortal/athena-led/Makefile

        rm -rf package/temp-athena
        echo "【led组合完成】"

        - name: AX6600默认配置
          run: |
          cd openwrt

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-ax6600-custom <<'EOF'
          #!/bin/sh

          #
          # 创建 lan3+lan4 网桥
          #
          if ! uci -q get network.ap2026092311 >/dev/null; then

            uci add network device >/dev/null

            uci set network.@device[-1].type='bridge'
            uci set network.@device[-1].name='ap20260923'
            uci add_list network.@device[-1].ports='lan3'
            uci add_list network.@device[-1].ports='lan4'

            uci set network.ap2026092311='interface'
            uci set network.ap2026092311.proto='static'
            uci set network.ap2026092311.device='ap20260923'
            uci set network.ap2026092311.ipaddr='192.168.32.1'
            uci set network.ap2026092311.netmask='255.255.255.0'
            uci set network.ap2026092311.delegate='0'
          fi

          #
          # DHCP
          #
          if ! uci -q get dhcp.ap2026092311 >/dev/null; then
            uci set dhcp.ap2026092311='dhcp'
            uci set dhcp.ap2026092311.interface='ap2026092311'
            uci set dhcp.ap2026092311.start='100'
            uci set dhcp.ap2026092311.limit='150'
            uci set dhcp.ap2026092311.leasetime='12h'
            uci set dhcp.ap2026092311.dhcpv4='server'
          fi

          #
          # IPv4 Only
          #
          uci set dhcp.ap2026092311.ra='disabled'
          uci set dhcp.ap2026092311.dhcpv6='disabled'
          uci set dhcp.ap2026092311.ndp='disabled'
          uci set dhcp.ap2026092311.ra_default='0'

          #
          # 加入LAN区域
          #
          if ! uci show firewall | grep -q "ap2026092311"; then
              uci add_list firewall.@zone[0].network='ap2026092311'
          fi

          #
          # WiFi
          #

          # 32网段
          uci -q get wireless.default_radio0 >/dev/null && {
              uci set wireless.default_radio0.ssid='CMCC-ft68'
              uci set wireless.default_radio0.network='ap2026092311'
              uci set wireless.default_radio0.key='12345678'
              uci set wireless.default_radio0.encryption='psk-mixed+ccmp'
              uci set wireless.default_radio0.hidden='0'
          }

          # 主LAN 2.4G
          uci -q get wireless.default_radio1 >/dev/null && {
              uci set wireless.default_radio1.ssid='Ly'
              uci set wireless.default_radio1.network='lan'
              uci set wireless.default_radio1.key='12345678'
              uci set wireless.default_radio1.encryption='psk-mixed+ccmp'
              uci set wireless.default_radio1.hidden='0'
          }

          # 主LAN 5G
          uci -q get wireless.default_radio2 >/dev/null && {
              uci set wireless.default_radio2.ssid='Ls'
              uci set wireless.default_radio2.network='lan'
              uci set wireless.default_radio2.key='12345678'
              uci set wireless.default_radio2.encryption='psk-mixed+ccmp'
              uci set wireless.default_radio2.hidden='0'
          }

          uci commit network
          uci commit dhcp
          uci commit firewall
          uci commit wireless

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-ax6600-custom

          echo "===== AX6600 CUSTOM ====="
          ls -l files/etc/uci-defaults/
          echo "========================="
        
    - name: 下载依赖
      run: |
        echo "【步骤7】下载依赖"
        cp -f $GITHUB_WORKSPACE/vikwrt.config $GITHUB_WORKSPACE/openwrt/.config
        cd openwrt
        make defconfig
        make download -j$(nproc) V=s
        find dl -size -1024c -exec rm -f {} \;
        echo "依赖下载完成 ✅"
        echo "【清理冗余文件】"
        rm -rf build_dir/host/ccache-* || true
        echo "【磁盘空间检查】"
        df -h /workdir


    - name: 编译固件
      run: |
        echo "【步骤8】编译固件"
        cd openwrt
        export CCACHE_DIR=${{ env.CCACHE_DIR }}
        export CC="ccache gcc"
        export CXX="ccache g++"
        make -j$(nproc)
        ccache -s
        echo "固件编译完成 ✅"

    - name: 清理编译中间文件
      if: always()
      run: |
        echo "【清理编译产物】"
        cd openwrt
        # 清理构建目录中的无用文件
        rm -rf build_dir/target-*/root-* || true
        rm -rf build_dir/target-*/linux-* || true
        # 保留最终输出文件
        du -sh /workdir/openwrt || true

    - name: 保存编译缓存
      uses: actions/cache@v3
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-openwrt-${{ env.DEVICE }}-ccache

    - name : 上传输出文件
      uses: actions/upload-artifact@master
      if: env.UPLOAD_OUTPUT == 'true' && !cancelled()
      with:
        name: ${{ env.DEVICE }}--${{ env.FILE_DATE }}
        path: openwrt/bin/targets

    
    - name: 设置环境变量
      run: |
       echo "DEVICE=$(echo '${{ env.DEVICE }}' | tr -cd '[:alnum:]-_')" >> $GITHUB_ENV
       echo "FILE_DATE=$(date +%Y-%m-%d_%H-%M)" >> $GITHUB_ENV

    - name: 发布固件至 Release
      uses: ncipollo/release-action@v1
      with:
          tag: "${{ env.DEVICE }}-${{ env.FILE_DATE }}"
          artifacts: "openwrt/bin/targets/*/*/*"
